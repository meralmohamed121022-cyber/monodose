<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Connection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0B192C;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #10b981;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        .buttons {
            display: flex;
            gap: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-retry {
            background: #10b981;
            color: white;
        }
        .btn-retry:active {
            background: #0e9f6e;
        }
        .btn-close {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .btn-close:active {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>Please check your internet connection and try again.</p>
    <div class="buttons">
        <button class="btn-close" onclick="closeApp()">Close</button>
        <button class="btn-retry" onclick="retry()">Retry</button>
    </div>

    <script>
        function closeApp() {
            if (window.AndroidApp) {
                window.AndroidApp.closeApp();
            }
        }
        function retry() {
            if (window.AndroidApp) {
                window.AndroidApp.retryConnection();
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
